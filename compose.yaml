services:
        backend:
                build: ./api/simpleapistudent/
                networks:
                        - 1tp-network
                depends_on:
                        - database
                ports:
                        - "8083:8080"

        adminer:
                image: adminer
                networks:
                        - 1tp-network
                depends_on:
                        - database
                ports:
                        - "8082:8080"

        database:
                build: ./database/
                networks:
                        - 1tp-network
                volumes:
                        - db-data:/var/lib/postgresql/data
                        #healthcheck:
                        #    test: ["CMD", "redis-cli", "ping"]
                        #    interval: 5s
                        #    timeout: 3s
                        #    retries: 5
                        #    start_period: 10s
                environment:
                        POSTGRES_PASSWORD: pwd

        frontend:
                build: ./devops-front/
                networks:
                        - 1tp-network
        httpd:
                build: ./webserver/
                ports:
                        - "8080:80"
                networks:
                        - 1tp-network
                depends_on:
                        - database
                        - backend
                        - frontend

networks:
        1tp-network:
volumes:
        db-data:
