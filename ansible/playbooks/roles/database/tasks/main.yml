---
# tasks file for roles/database
- name: Run database
  docker_container:
    name: docker-tp-database-1
    image: karelbf/tp-devops-database
    networks:
      - name: 1tp-network
    volumes:
      - db-data:/var/lib/postgresql/data
    env:
      POSTGRES_PASSWORD: pwd
