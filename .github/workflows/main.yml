name: CI devops 2026
on:
  #to begin you want to launch this job in main and develop
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test-backend: 
    environment: github action env
    runs-on: ubuntu-24.04
    steps:
      #checkout your github code using actions/checkout@v7
      - uses: actions/checkout@v7

      #do the same with another action (actions/setup-java@v6) that enable to setup jdk 21
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: java --version

      #finally build your app with the latest command
      - name: Build and test with Maven
        working-directory: ./api/simpleapistudent/
        run: mvn clean verify

      - name: Check code quality with Sonarcloud
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=docker-tp_docker-tp-sonarcloud  -Dsonar.organization=docker-tp -Dsonar.host.url=https://sonarcloud.io -Dsonar.login=${{ secrets.SONAR_TOKEN }}  --file ./api/simpleapistudent/pom.xml
  # define job to build and publish docker image
  build-and-push-docker-image:
    environment: github action env
    needs: test-backend
    # run only when code is compiling and tests are passing
    runs-on: ubuntu-24.04
   
    # steps to perform in job
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to DockerHub
        run: echo '${{ secrets.DOCKERHUB_PASSWORD }}' | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
   
      - name: Build image and push backend
        uses: docker/build-push-action@v7
        with:
          # relative path to the place where source code with Dockerfile is located
          context: ./api/simpleapistudent/
          # Note: tags has to be all lower-case
          tags:  ${{secrets.DOCKERHUB_DISPLAYNAME}}/tp-devops-simple-api:latest
          # build on feature branches, push only on main branch
          push: ${{ github.ref == 'refs/heads/main' }}
   
      - name: Build image and push database
        uses: docker/build-push-action@v7
        with:
          # relative path to the place where source code with Dockerfile is located
          context: ./database/
          # Note: tags has to be all lower-case
          tags:  ${{secrets.DOCKERHUB_DISPLAYNAME}}/tp-devops-database:latest
          # build on feature branches, push only on main branch
          push: ${{ github.ref == 'refs/heads/main' }}
   
      - name: Build image and push httpd
        uses: docker/build-push-action@v7
        with:
          # relative path to the place where source code with Dockerfile is located
          context: ./webserver/
          # Note: tags has to be all lower-case
          tags:  ${{secrets.DOCKERHUB_DISPLAYNAME}}/tp-devops-webserver:latest
          # build on feature branches, push only on main branch
          push: ${{ github.ref == 'refs/heads/main' }}
